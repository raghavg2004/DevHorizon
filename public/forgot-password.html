<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Forgot Password - DevHorizan</title>
  <link href="assets/img/logo.png" rel="icon">
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(circle at 10% 20%, rgba(47, 111, 237, 0.08), transparent 30%), #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      padding: 20px;
    }
    .card-box {
      max-width: 440px;
      width: 100%;
      background: white;
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.06);
      border: 1px solid #e2e8f0;
    }
    .btn-submit {
      background: linear-gradient(135deg, #2f6fed, #388da8);
      color: white;
      font-weight: 600;
      padding: 12px;
      border-radius: 10px;
      border: none;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="card-box">
    <div class="text-center mb-4">
      <img src="assets/img/logo.png" alt="DevHorizan" style="height: 44px; margin-bottom: 12px;">
      <h3 class="fw-bold fs-4 text-dark mb-1">Forgot Password</h3>
      <p class="text-muted fs-6">Enter your registered email and we'll send you instructions to reset your password.</p>
    </div>

    <div id="alertBox" class="alert d-none mb-3" role="alert"></div>

    <form id="forgotForm" onsubmit="handleForgot(event)">
      <div class="mb-3">
        <label class="form-label fw-semibold text-secondary" style="font-size: 13px;">Email Address</label>
        <input type="email" id="email" class="form-control py-2" placeholder="name@company.com" required>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-submit mb-3">Send Reset Instructions</button>

      <div class="text-center">
        <a href="/login" class="text-decoration-none fw-medium text-primary fs-6">
          <i class="bi bi-arrow-left me-1"></i> Return to Sign In
        </a>
      </div>
    </form>
  </div>

  <script>
    async function handleForgot(event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const alertBox = document.getElementById('alertBox');
      const btn = document.getElementById('submitBtn');

      btn.disabled = true;
      btn.textContent = 'Sending...';

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        alertBox.className = 'alert alert-success d-block';
        alertBox.textContent = data.message;
        document.getElementById('email').value = '';
      } catch (err) {
        alertBox.className = 'alert alert-danger d-block';
        alertBox.textContent = 'Server error. Please try again.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Reset Instructions';
      }
    }
  </script>
</body>
</html>
