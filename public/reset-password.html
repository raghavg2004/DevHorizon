<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Reset Password - DevHorizan</title>
  <link href="assets/img/logo.png" rel="icon">
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(circle at 10% 20%, rgba(47, 111, 237, 0.08), transparent 30%), #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      padding: 20px;
    }
    .card-box {
      max-width: 440px;
      width: 100%;
      background: white;
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.06);
      border: 1px solid #e2e8f0;
    }
    .btn-submit {
      background: linear-gradient(135deg, #2f6fed, #388da8);
      color: white;
      font-weight: 600;
      padding: 12px;
      border-radius: 10px;
      border: none;
      width: 100%;
    }
    @media (max-width: 575px) {
      body { padding: 16px 12px; }
      .card-box { padding: 24px 18px; border-radius: 16px; }
      input.form-control { font-size: 16px !important; }
    }
  </style>
</head>
<body>
  <div class="card-box">
    <div class="text-center mb-4">
      <img src="assets/img/logo.png" alt="DevHorizan" style="height: 44px; margin-bottom: 12px;">
      <h3 class="fw-bold fs-4 text-dark mb-1">Set New Password</h3>
      <p class="text-muted fs-6">Create a strong new password for your DevHorizan account.</p>
    </div>

    <div id="alertBox" class="alert d-none mb-3" role="alert"></div>

    <form id="resetForm" onsubmit="handleReset(event)">
      <div class="mb-3">
        <label class="form-label fw-semibold text-secondary" style="font-size: 13px;">New Password</label>
        <input type="password" id="newPassword" class="form-control py-2" placeholder="Minimum 6 characters" required>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold text-secondary" style="font-size: 13px;">Confirm New Password</label>
        <input type="password" id="confirmPassword" class="form-control py-2" placeholder="Re-type new password" required>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-submit mb-3">Update Password</button>

      <div class="text-center">
        <a href="/login" class="text-decoration-none fw-medium text-primary fs-6">
          <i class="bi bi-arrow-left me-1"></i> Return to Sign In
        </a>
      </div>
    </form>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    async function handleReset(event) {
      event.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const alertBox = document.getElementById('alertBox');
      const btn = document.getElementById('submitBtn');

      if (!token) {
        alertBox.className = 'alert alert-danger d-block';
        alertBox.textContent = 'Invalid or missing password reset token.';
        return;
      }

      if (newPassword !== confirmPassword) {
        alertBox.className = 'alert alert-danger d-block';
        alertBox.textContent = 'Passwords do not match.';
        return;
      }

      if (newPassword.length < 6) {
        alertBox.className = 'alert alert-danger d-block';
        alertBox.textContent = 'Password must be at least 6 characters long.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Updating...';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, new_password: newPassword })
        });
        const data = await res.json();

        if (data.success) {
          alertBox.className = 'alert alert-success d-block';
          alertBox.textContent = data.message;
          setTimeout(() => {
            window.location.href = '/login';
          }, 1500);
        } else {
          alertBox.className = 'alert alert-danger d-block';
          alertBox.textContent = data.message || 'Failed to reset password.';
          btn.disabled = false;
          btn.textContent = 'Update Password';
        }
      } catch (err) {
        alertBox.className = 'alert alert-danger d-block';
        alertBox.textContent = 'Server error. Please try again.';
        btn.disabled = false;
        btn.textContent = 'Update Password';
      }
    }
  </script>
</body>
</html>
