services:
  - type: web
    name: devhorizan-platform
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_USER
        value: devhorizan@gmail.com
      - key: EMAIL_APP_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: UPLOADS_DIR
        value: /var/data/uploads
    disk:
      name: devhorizan-storage
      mountPath: /var/data
      sizeGB: 1

